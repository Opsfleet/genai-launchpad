[project]
name = "datastream-bootcamp"
version = "0.1.0"
description = "DataStream Corp GenAI bootcamp (participant): Phase 1 scripts and the Phase 2 AgentCore CLI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "strands-agents[openai]>=1.58,<2",
    "fastmcp>=2.12",
    "mcp>=1.15",
    "boto3[crt]>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.1",
    "pyyaml>=6",
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["guide"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bootcamp_cli", "common", "hooks", "litellm_gateway", "nws_weather", "sql_guard", "sandbox_tools", "guardrail", "prompt_variants", "trace_spans"]
